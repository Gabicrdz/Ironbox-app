version: '3.8'

services:
  postgres_db:
    image: postgres:15-alpine
    container_name: ironbox_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ironbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en el archivo .env}
      POSTGRES_DB: ironbox_core
    ports:
      - "5432:5432"
    volumes:
      - db_storage:/var/lib/postgresql/data

volumes:
  db_storage: