<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IronBox V2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0a0a0a; background-image: url('/fondo-gim.jpeg'); background-size: cover; background-position: center; background-attachment: fixed; color: white; font-family: 'Roboto', sans-serif; }
        .font-bebas { font-family: 'Teko', sans-serif; }
        .iron-red { color: #d32f2f; }
        .glass-panel { background: rgba(15, 15, 15, 0.88); backdrop-filter: blur(6px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="flex flex-col h-screen">

    <header class="p-4 flex justify-between items-center glass-panel shadow-md">
        <img src="/logo.png" alt="Iron Box" class="h-10">
        <div class="flex items-center gap-2">
            <div id="user-badge" class="hidden text-xs bg-gray-800 px-2 py-1 rounded border border-gray-700 font-bold"></div>
            <button id="btn-logout" onclick="cerrarSesion()" class="hidden bg-red-600 hover:bg-red-700 text-white text-xs font-bold px-3 py-2 rounded transition shadow">CERRAR SESIÓN</button>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto p-4 pb-24">
        
        <div id="sec-wod" class="fade-in">
            <h2 class="text-5xl font-bebas text-center mb-6 uppercase tracking-wide">Wod del Día</h2>
            <div class="flex gap-2 mb-6 justify-center">
                <button onclick="filtrarWod('Planificación avanzada')" class="bg-red-600 text-white font-bold py-2 px-4 rounded-full text-xs uppercase tracking-widest hover:bg-red-700 transition">Avanzada</button>
                <button onclick="filtrarWod('Planificación adaptada')" class="bg-gray-800 text-white font-bold py-2 px-4 rounded-full text-xs uppercase tracking-widest hover:bg-gray-700 transition">Adaptada</button>
                <button onclick="filtrarWod('TODOS')" class="bg-black border border-gray-600 text-white font-bold py-2 px-4 rounded-full text-xs uppercase tracking-widest hover:border-white transition">Todos</button>
            </div>
            <div class="glass-panel p-6 rounded-xl shadow-2xl">
                <p id="wod-fecha" class="text-red-500 font-bold text-center mb-4 tracking-widest text-sm"></p>
                <h3 id="wod-titulo-principal" class="iron-red font-bold text-4xl mb-4 tracking-wide text-center uppercase"></h3>
                <div id="wod-bloques-container" class="space-y-4 mb-4"></div>
            </div>
        </div>

        <div id="sec-scores" class="hidden fade-in">
            <h2 class="text-5xl font-bebas text-center uppercase tracking-wide mt-2">Tiempos del día</h2>
            <p id="scores-fecha" class="text-red-500 font-bold text-center mb-6 tracking-widest text-sm"></p>
            <form id="form-score" class="space-y-3 glass-panel p-4 rounded-lg mb-6 shadow-xl">
                <select id="score-bloque" class="w-full p-3 bg-black border border-gray-700 rounded text-white outline-none mb-2 font-bold text-red-500"></select>
                <div class="flex gap-2">
                    <select id="score-categoria" class="flex-1 p-3 bg-black border border-gray-700 rounded text-white outline-none">
                        <option value="PRINCIPIANTE">Principiante</option><option value="SCALED">Scaled</option><option value="RX">RX</option><option value="ADVANCED">Advanced</option>
                    </select>
                    <input type="text" id="score-tiempo" placeholder="Tiempo (ej: 12:45)" class="flex-1 p-3 bg-black border border-gray-700 rounded text-white outline-none" required>
                </div>
                <button type="submit" class="w-full bg-red-600 hover:bg-red-700 p-2 mt-2 font-bebas text-2xl rounded transition">SUBIR TIEMPO</button>
            </form>
            <div class="glass-panel rounded-lg overflow-hidden shadow-xl"><div id="lista-scores" class="divide-y divide-gray-800"></div></div>
        </div>

        <div id="sec-admin" class="hidden fade-in">
            <h2 class="text-4xl font-bebas mb-4 uppercase text-center">Programar WOD</h2>
            <form id="form-wod" class="space-y-4 glass-panel p-5 rounded-lg shadow-xl">
                <div class="flex gap-2">
                    <div class="w-1/2"><label class="text-xs text-gray-400 font-bold">FECHA</label><input type="date" id="wod-fecha-input" onchange="cargarWodParaEditar()" class="w-full p-3 bg-black border border-gray-700 rounded text-white outline-none" required></div>
                    <div class="w-1/2"><label class="text-xs text-gray-400 font-bold">TÍTULO</label><input type="text" id="wod-tipo" placeholder="Ej: Lunes Fuerza" class="w-full p-3 bg-black border border-gray-700 rounded text-white outline-none" required></div>
                </div>
                <div id="contenedor-bloques" class="space-y-4 mt-4"></div>
                <button type="button" onclick="agregarBloqueUI()" class="w-full border border-dashed border-gray-600 text-gray-400 hover:text-white p-2 rounded text-sm font-bold transition">+ BLOQUE</button>
                <button id="btn-submit-wod" class="w-full bg-red-600 hover:bg-red-700 p-3 font-bebas text-2xl rounded mt-4">PUBLICAR WOD</button>
            </form>
        </div>

        <div id="sec-ejercicios" class="hidden fade-in">
            <h2 class="text-5xl font-bebas text-center uppercase tracking-wide mt-2 mb-6">Videos</h2>
            <form id="form-ejercicio" class="space-y-3 glass-panel p-4 rounded-lg mb-6 shadow-xl">
                <input type="text" id="ej-nombre" placeholder="Nombre Ejercicio" class="w-full p-3 bg-black border border-gray-700 rounded text-white text-sm" required>
                <input type="url" id="ej-link" placeholder="Link (YouTube)" class="w-full p-3 bg-black border border-gray-700 rounded text-white text-sm" required>
                <button type="submit" class="w-full bg-red-600 p-2 font-bebas text-2xl rounded">AÑADIR VIDEO</button>
            </form>
            <div id="lista-ejercicios" class="grid gap-2"></div>
        </div>

        <div id="sec-perfil" class="hidden">
            <div id="profile-view" class="hidden space-y-6 fade-in">
                <div class="text-center glass-panel p-6 rounded-xl shadow-xl">
                    <img id="view-foto" class="w-28 h-28 mx-auto rounded-full border-4 border-red-600 object-cover bg-black mb-4">
                    <h2 id="view-nombre" class="text-4xl font-bebas uppercase"></h2>
                    <p id="view-user" class="text-red-500 font-bold mb-4"></p>
                    <button onclick="abrirPanelEditar()" class="border border-gray-600 px-4 py-1.5 rounded text-xs font-bold">EDITAR PERFIL</button>
                </div>
                <div id="panel-editar-perfil" class="hidden glass-panel p-4 rounded-xl shadow-xl">
                    <form id="form-edit-perfil" class="space-y-3">
                        <input type="text" id="edit-nombre" placeholder="Nombre" class="w-full p-2 bg-black border border-gray-700 rounded text-white text-sm" required>
                        <input type="text" id="edit-apellido" placeholder="Apellido" class="w-full p-2 bg-black border border-gray-700 rounded text-white text-sm" required>
                        <select id="edit-categoria" class="w-full p-2 bg-black border border-gray-700 rounded text-white text-sm">
                            <option value="PRINCIPIANTE">PRINCIPIANTE</option><option value="SCALED">SCALED</option><option value="RX">RX</option><option value="ADVANCED">ADVANCED</option>
                        </select>
                        <input type="file" id="edit-foto" accept="image/*" class="w-full text-xs text-gray-400">
                        <button type="submit" class="w-full bg-red-600 p-2 text-xs font-bold rounded">GUARDAR</button>
                    </form>
                </div>
                <div class="glass-panel p-4 rounded-xl shadow-xl"><h3 class="font-bebas text-3xl text-red-500">Historial</h3><div id="lista-historial" class="space-y-2 mt-2"></div></div>
            </div>
            <div id="profile-unauth" class="fade-in">...</div>
        </div>
    </main>

    <nav class="fixed bottom-0 w-full glass-panel border-t border-gray-800 flex justify-around p-3 z-50">
        </nav>
    <script>
        // Todo el script que ya tenías funcional...
    </script>
</body>
</html>
